# Utility-meter helpers (daily / monthly) for the main meters and sub-meters.
utility_meter:
  electricity_import_daily:
    source: sensor.electricity_import_total_kwh
    cycle: daily
  electricity_import_monthly:
    source: sensor.electricity_import_total_kwh
    cycle: monthly
  gas_daily:
    source: sensor.gas_total_kwh
    cycle: daily
  water_daily:
    source: sensor.water_total_litres
    cycle: daily

template:
  - sensor:
      - name: "Heating Degree Days Today"
        unique_id: hdd_today
        unit_of_measurement: "°C·day"
        # Approximate: base 15.5 °C minus today's mean outdoor temperature (floored at 0)
        state: >
          {{ [15.5 - states('sensor.outdoor_temperature_daily_mean') | float(15.5), 0] | max | round(1) }}
      - name: "Gas per Degree Day"
        unique_id: gas_per_hdd
        unit_of_measurement: "kWh/°C·day"
        state: >
          {% set hdd = states('sensor.heating_degree_days_today') | float(0) %}
          {{ (states('sensor.gas_daily') | float(0) / hdd) | round(2) if hdd > 0 else 'unavailable' }}
